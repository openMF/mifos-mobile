name: iOS Build

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      create_ipa:
        description: 'Create IPA Archive'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - development
      - main
    paths:
      - 'cmp-ios/**'
      - 'cmp-shared/**'
      - 'core/**'
      - 'feature/**'
      - '.github/workflows/ios-build.yml'

  pull_request:
    branches:
      - development
      - main
    paths:
      - 'cmp-ios/**'
      - 'cmp-shared/**'
      - 'core/**'
      - 'feature/**'

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            cmp-ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('cmp-ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build KMP Shared Framework
        run: |
          echo "Building shared framework for iOS..."
          ./gradlew :cmp-shared:assembleXCFramework

      - name: Install CocoaPods dependencies
        working-directory: cmp-ios
        run: |
          echo "Installing CocoaPods..."
          pod install --repo-update

      - name: Build iOS App (${{ inputs.build_configuration || 'Debug' }})
        working-directory: cmp-ios
        run: |
          CONFIGURATION="${{ inputs.build_configuration || 'Debug' }}"
          echo "Building iOS app with configuration: $CONFIGURATION"

          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration $CONFIGURATION \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Create IPA Archive
        if: inputs.create_ipa == true
        working-directory: cmp-ios
        run: |
          echo "Creating IPA archive..."

          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -archivePath ./build/iosApp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Export archive to IPA
          xcodebuild \
            -exportArchive \
            -archivePath ./build/iosApp.xcarchive \
            -exportPath ./build/ipa \
            -exportOptionsPlist ./exportOptions.plist

      - name: Upload IPA Artifact
        if: inputs.create_ipa == true
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Rate-iOS-${{ github.run_number }}
          path: cmp-ios/build/ipa/*.ipa
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "### ✅ iOS Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:** ${{ inputs.build_configuration || 'Debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Xcode Version:** 16.1" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** iOS" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.create_ipa }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **IPA Created:** Check artifacts for download" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Failure Summary
        if: failure()
        run: |
          echo "### ❌ iOS Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for error details." >> $GITHUB_STEP_SUMMARY
